<body class="bg-dark d-flex align-items-center" style="min-height:100vh;">

<script>

    box.style.background = '#7a1f1f';
    box.scrollIntoView({behavior:'smooth'});
  }
  alert('This is a static preview build. Form submission (booking, login, contact) requires the live PHP/MySQL backend — see the README for how to run it locally.');
